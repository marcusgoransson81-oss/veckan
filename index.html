<style>

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}

.bra h3,.kol h3,.tek h3{margin:0;font-size:18px}
.tek{background:linear-gradient(135deg,var(--kemibg),var(--mattebg));border-color:transparent}
.tek p{margin:8px 0}.tek ul{margin:8px 0 0;padding-left:18px}.tek li{margin:4px 0;font-size:14.5px}
.foot{font-size:12.5px;color:var(--mut);margin-top:26px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;transition:transform .25s;z-index:9}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:520px){.tempo{gap:5px}.tb small{display:none}.days{grid-template-columns:1fr 1fr}.day{min-height:0}}

.upd{font-size:11.5px;color:var(--mut);text-align:right;margin:0 0 6px;opacity:.85}.demo{background:#fff1b8;color:#5c4400;border:1px dashed #d4a400;border-radius:12px;padding:9px 13px;font-size:13.5px;font-weight:600;margin:0 0 10px}
.ny{display:inline-block;font:800 9.5px Inter;letter-spacing:.06em;background:#ffd23f;color:#3d2e00;border-radius:5px;padding:2px 6px;vertical-align:2px;margin-left:6px}
.kunna li{flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;border-bottom:1px dashed var(--line);padding:7px 0}

.lv{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}

.kbar{position:relative}.kbar i{position:absolute;left:0;top:0;bottom:0}.kbar i.a{background:var(--pb);filter:saturate(2)}.kbar i.b{background:var(--pc)}
.kprog span{font-weight:500;color:var(--mut)}.kprog span b{color:var(--pc)}
.lvhelp{font-size:12.5px;color:var(--mut);margin-top:6px}
.lnk{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}.lnk a{font-size:13px;font-weight:600;color:var(--pc);background:var(--pb);border-radius:999px;padding:5px 11px;text-decoration:none}
details.top3,details.eft{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--soft)}
details summary{font-weight:700;font-size:14px;cursor:pointer}
.top3 .q{font-size:13.5px;margin:10px 0 8px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cmp>div{border-radius:10px;padding:8px 10px;background:var(--card);border:1px solid var(--line)}.cmp .a{border:2px solid var(--pc)}

.top3 ul{margin:10px 0 0;padding-left:18px;font-size:13.5px}.top3 li{margin:3px 0}
.fn{font-size:12px;color:var(--mut);margin:8px 0 0}
.eft label{display:block;font-size:13px;font-weight:600;margin-top:8px}.eft textarea{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:8px;padding:6px;font:13.5px Inter;background:var(--card);color:var(--ink)}
.ov{display:grid;gap:2px}.or{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}.or b{flex:none;width:92px}.or span{flex:1;color:var(--mut)}.or a{font-size:12.5px;font-weight:600}

.kg.tst{color:var(--pc)}.kunna li.test .kt:after{content:' 🎯'}

.pk-l{font-weight:700;color:var(--pc);text-decoration:none;white-space:nowrap;margin-left:4px}
</style></head><body><main id="app"><p style="padding:40px;text-align:center;color:var(--mut)">Laddar veckan…</p></main><div class="toast" id="toast"></div>
<script>
(async function(){
const app=document.getElementById('app');
let D;
try{D=await (await fetch('data.json',{cache:'no-store'})).json()}catch(e){app.innerHTML='<p class="card">Kunde inte ladda veckan just nu. Prova att ladda om sidan.</p>';return}
// Dagsmedveten text (se UPDATE.md): {dag:ÅÅÅÅ-MM-DD}, {kvar:ÅÅÅÅ-MM-DD}, [[före:ÅÅÅÅ-MM-DD|text]], [[från:ÅÅÅÅ-MM-DD|text]], varianter [{fran,till,text}], objekt i listor med fran/till. Rör aldrig kunna/fraga (bockarnas nycklar).
const REL=(()=>{const T=new Date();T.setHours(0,0,0,0);const P=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)},df=s=>Math.round((P(s)-T)/864e5),W=['söndag','måndag','tisdag','onsdag','torsdag','fredag','lördag'],K=['sön','mån','tis','ons','tor','fre','lör'];
 const dag=s=>{const n=df(s),d=P(s),dm=d.getDate()+'/'+(d.getMonth()+1);if(n==0)return'i dag';if(n==1)return'i morgon';if(n==-1)return'i går';if(n>1&&n<7)return'på '+W[d.getDay()]+' '+dm;if(n<-1&&n>-7)return'i '+W[d.getDay()]+'s';return K[d.getDay()]+' '+dm};
 const kvar=s=>{const n=df(s);return n==0?'i dag':n==1?'i morgon':n>1?'om '+n+' dagar':n==-1?'i går':'för '+(-n)+' dagar sedan'};
 const ok=o=>(!o.fran||df(o.fran)<=0)&&(!o.till||df(o.till)>=0);
 const str=s=>{let p;do{p=s;s=s.replace(/\[\[(före|från):(\d{4}-\d\d-\d\d)\|([^\[\]]*)\]\]/g,(m,k,d,t)=>(k=='före'?df(d)>0:df(d)<=0)?t:'')}while(s!=p);return s.replace(/\{dag:(\d{4}-\d\d-\d\d)\}/g,(m,d)=>dag(d)).replace(/\{Dag:(\d{4}-\d\d-\d\d)\}/g,(m,d)=>{const x=dag(d);return x[0].toUpperCase()+x.slice(1)}).replace(/\{kvar:(\d{4}-\d\d-\d\d)\}/g,(m,d)=>kvar(d)).replace(/ {2,}/g,' ').replace(/ ([.,:])/g,'$1').trim()};
 const isVar=v=>Array.isArray(v)&&v.length&&v.every(o=>o&&typeof o=='object'&&'text'in o&&Object.keys(o).every(k=>['fran','till','text'].includes(k)));
 const walk=(v,key)=>{if(key=='kunna'||key=='fraga')return v;if(typeof v=='string')return str(v);if(isVar(v)){const m=v.filter(ok).pop();return m?str(m.text):''}if(Array.isArray(v)){const fx=!['plugg','dagar','prov','grupper'].includes(key);return v.filter(o=>!fx||!(o&&typeof o=='object'&&!Array.isArray(o)&&('fran'in o||'till'in o))||ok(o)).map(x=>walk(x)).filter(x=>!fx||x!=='')}if(v&&typeof v=='object'){const o={};for(const k in v)o[k]=walk(v[k],k);return o}return v};
 return D=>walk(D)})();
D=REL(D);
const hs=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))|0;return (h>>>0).toString(36)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)};
const today=new Date();today.setHours(0,0,0,0);
const dd=(a,b)=>Math.round((b-a)/864e5);
const DN=['Sön','Mån','Tis','Ons','Tor','Fre','Lör'],MN=['jan','feb','mars','apr','maj','juni','juli','aug','sep','okt','nov','dec'];
const fd=d=>`${DN[d.getDay()].toLowerCase()} ${d.getDate()}/${d.getMonth()+1}`;
const COL={'Kemi':'kemi','Matte':'matte','Franska':'franska','Fysik':'fysik','Fysik och teknik':'fysik','Svenska':'svenska'};
const SB='https://wpjgybjmezxorhltbdcr.supabase.co/rest/v1/checks',SK='sb_publishable_bbDqfwFGM5plLU7DWIhlsg_TWjOE8L-',SH={apikey:SK,'Content-Type':'application/json'};
const LS={g(k){try{return localStorage.getItem(k)}catch(e){return null}},s(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}},keys(){try{return Object.keys(localStorage)}catch(e){return[]}}};
